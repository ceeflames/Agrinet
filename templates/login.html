<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriNet — Login</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <style>
      .auth-container {
        max-width: 420px;
        margin: 2rem auto;
        padding: 1rem;
      }
      .auth-card {
        background: white;
        border-radius: 1.5rem;
        padding: 2rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .auth-card h2 {
        text-align: center;
        color: #065f46;
        margin-bottom: 1.5rem;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.3rem;
        font-size: 0.9rem;
        color: #374151;
      }
      .form-group input {
        width: 100%;
        padding: 0.6rem 0.8rem;
        border-radius: 0.5rem;
        border: 1px solid #d1d5db;
        font-size: 0.95rem;
        box-sizing: border-box;
      }
      .submit-btn {
        width: 100%;
        padding: 0.75rem;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      .submit-btn:hover {
        background: #059669;
      }
      .submit-btn:disabled {
        background: #9ca3af;
      }
      .link-row {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.9rem;
        color: #6b7280;
      }
      .link-row a {
        color: #10b981;
        font-weight: 600;
        text-decoration: none;
      }
      .error-msg {
        background: #fee2e2;
        color: #991b1b;
        padding: 0.75rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        display: none;
        font-size: 0.9rem;
      }
      .success-msg {
        background: #d1fae5;
        color: #065f46;
        padding: 0.75rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        display: none;
        font-size: 0.9rem;
      }
      .divider {
        text-align: center;
        color: #9ca3af;
        margin: 1rem 0;
        font-size: 0.85rem;
      }
      .reset-section {
        display: none;
      }
    </style>
  </head>
  <body class="bg-gradient">
    <header class="header container">
      <a
        href="/"
        style="
          text-decoration: none;
          font-weight: bold;
          font-size: 1.25rem;
          color: #065f46;
        "
        >🌿 AgriNet</a
      >
    </header>

    <div class="auth-container">
      <div class="auth-card">
        <!-- Login Form -->
        <div id="login-section">
          <h2>🌿 Welcome Back</h2>
          <div id="error-msg" class="error-msg"></div>
          <div id="success-msg" class="success-msg"></div>
          <form id="login-form">
            <div class="form-group">
              <label>Email Address</label>
              <input
                type="email"
                name="email"
                placeholder="you@email.com"
                required
              />
            </div>
            <div class="form-group">
              <label>Password</label>
              <input
                type="password"
                name="password"
                placeholder="Your password"
                required
              />
            </div>
            <button type="submit" class="submit-btn" id="login-btn">
              Log In
            </button>
          </form>
          <div class="divider">or</div>
          <div class="link-row">
            <a href="#" onclick="showReset()">Forgot Password?</a>
          </div>
          <div class="link-row" style="margin-top: 0.5rem">
            Don't have an account? <a href="/signup">Sign Up</a>
          </div>
        </div>

        <!-- Reset Password Form -->
        <div id="reset-section" class="reset-section">
          <h2>🔑 Reset Password</h2>
          <div id="reset-error" class="error-msg"></div>
          <div id="reset-success" class="success-msg"></div>

          <!-- Step 1: Enter email -->
          <div id="reset-step1">
            <p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 1rem">
              Enter your email to receive a reset OTP.
            </p>
            <div class="form-group">
              <label>Email Address</label>
              <input
                type="email"
                id="reset-email"
                placeholder="you@email.com"
              />
            </div>
            <button class="submit-btn" onclick="requestReset()">
              Send Reset OTP
            </button>
          </div>

          <!-- Step 2: Enter OTP + new password -->
          <div id="reset-step2" style="display: none">
            <p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 1rem">
              Enter the OTP sent to your phone and your new password.
            </p>
            <div class="form-group">
              <label>OTP Code</label>
              <input
                type="text"
                id="reset-otp"
                placeholder="6-digit OTP"
                maxlength="6"
              />
            </div>
            <div class="form-group">
              <label>New Password</label>
              <input
                type="password"
                id="new-password"
                placeholder="Min 8 characters"
                minlength="8"
              />
            </div>
            <div class="form-group">
              <label>Confirm Password</label>
              <input
                type="password"
                id="confirm-password"
                placeholder="Repeat new password"
              />
            </div>
            <button class="submit-btn" onclick="submitReset()">
              Reset Password
            </button>
          </div>

          <div class="link-row" style="margin-top: 1rem">
            <a href="#" onclick="showLogin()">← Back to Login</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      let resetUserId = null;

      function showReset() {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("reset-section").style.display = "block";
      }

      function showLogin() {
        document.getElementById("reset-section").style.display = "none";
        document.getElementById("login-section").style.display = "block";
      }

      async function requestReset() {
        const email = document.getElementById("reset-email").value;
        if (!email) {
          showResetError("Please enter your email");
          return;
        }
        const formData = new FormData();
        formData.append("email", email);
        const res = await fetch("/auth/request-reset", {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        if (res.ok) {
          resetUserId = data.user_id;
          document.getElementById("reset-step1").style.display = "none";
          document.getElementById("reset-step2").style.display = "block";
          showResetSuccess("OTP sent to your phone!");
        } else {
          showResetError(data.detail || "Email not found");
        }
      }

      async function submitReset() {
        const otp = document.getElementById("reset-otp").value;
        const newPassword = document.getElementById("new-password").value;
        const confirmPassword =
          document.getElementById("confirm-password").value;
        if (!otp || !newPassword) {
          showResetError("Please fill all fields");
          return;
        }
        if (newPassword !== confirmPassword) {
          showResetError("Passwords do not match");
          return;
        }
        if (newPassword.length < 8) {
          showResetError("Password must be at least 8 characters");
          return;
        }
        const formData = new FormData();
        formData.append("user_id", resetUserId);
        formData.append("otp", otp);
        formData.append("new_password", newPassword);
        const res = await fetch("/auth/reset-password", {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        if (res.ok) {
          showResetSuccess("Password reset! Redirecting to login...");
          setTimeout(() => {
            showLogin();
          }, 2000);
        } else {
          showResetError(data.detail || "Reset failed");
        }
      }

      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("login-btn");
          btn.disabled = true;
          btn.textContent = "Logging in...";
          const formData = new FormData(e.target);
          try {
            const res = await fetch("/auth/login", {
              method: "POST",
              body: formData,
            });
            const data = await res.json();
            if (res.ok) {
              localStorage.setItem("token", data.token);
              localStorage.setItem("role", data.role);
              localStorage.setItem("name", data.name);
              showSuccess(`Welcome back, ${data.name}! Redirecting...`);
              const routes = {
                farmer: "/farmer-dashboard",
                consumer: "/consumer-dashboard",
                investor: "/investor-dashboard",
                vet: "/vet-dashboard",
                vendor: "/vendor-dashboard",
                admin: "/admin-dashboard",
              };
              setTimeout(() => {
                window.location.href = routes[data.role] || "/dashboard";
              }, 1500);
            } else {
              showError(data.detail || "Login failed");
              btn.disabled = false;
              btn.textContent = "Log In";
            }
          } catch (err) {
            showError("Something went wrong");
            btn.disabled = false;
            btn.textContent = "Log In";
          }
        });

      function showError(msg) {
        const el = document.getElementById("error-msg");
        el.textContent = msg;
        el.style.display = "block";
        document.getElementById("success-msg").style.display = "none";
      }
      function showSuccess(msg) {
        const el = document.getElementById("success-msg");
        el.textContent = msg;
        el.style.display = "block";
        document.getElementById("error-msg").style.display = "none";
      }
      function showResetError(msg) {
        const el = document.getElementById("reset-error");
        el.textContent = msg;
        el.style.display = "block";
        document.getElementById("reset-success").style.display = "none";
      }
      function showResetSuccess(msg) {
        const el = document.getElementById("reset-success");
        el.textContent = msg;
        el.style.display = "block";
        document.getElementById("reset-error").style.display = "none";
      }
    </script>
  </body>
</html>
