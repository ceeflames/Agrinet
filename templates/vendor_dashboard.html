<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriNet — Vendor Dashboard</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
  </head>
  <body class="bg-gradient">
    <header class="header container">
      <a
        href="/"
        style="
          text-decoration: none;
          font-weight: bold;
          font-size: 1.25rem;
          color: #065f46;
        "
        >🌿 AgriNet</a
      >
      <div style="display: flex; align-items: center; gap: 0.75rem">
        <span id="user-name" style="font-weight: 600; color: #065f46"></span>
        <span class="role-badge" style="background: #fef3c7; color: #92400e"
          >🏭 Vendor</span
        >
        <button
          onclick="window.location.href = '/wallet'"
          style="
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            border: none;
            background: #065f46;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
          "
        >
          💰 My Wallet
        </button>
        <button class="btn-logout" onclick="logout()">Log Out</button>
      </div>
    </header>

    <div class="dash-container">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon">❄️</div>
          <div class="stat-info">
            <div class="stat-value" id="total-cold-rooms">0</div>
            <div class="stat-label">Cold Rooms</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🚜</div>
          <div class="stat-info">
            <div class="stat-value" id="total-equipment">0</div>
            <div class="stat-label">Equipment</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🌱</div>
          <div class="stat-info">
            <div class="stat-value" id="total-farmland">0</div>
            <div class="stat-label">Farmland</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🔖</div>
          <div class="stat-info">
            <div class="stat-value" id="verification-status">Pending</div>
            <div class="stat-label">Verification</div>
          </div>
        </div>
      </div>

      <div class="dash-tabs">
        <button class="dash-tab active" onclick="showTab('cold-rooms', this)">
          ❄️ Cold Rooms
        </button>
        <button class="dash-tab" onclick="showTab('equipment', this)">
          🚜 Equipment
        </button>
        <button class="dash-tab" onclick="showTab('farmland', this)">
          🌱 Farmland
        </button>
        <button class="dash-tab" onclick="showTab('notifications', this)">
          🔔 Alerts
        </button>
      </div>

      <!-- Cold Rooms Tab -->
      <div id="tab-cold-rooms" class="dash-tab-content active">
        <div class="dash-card">
          <h3>➕ Add Cold Room</h3>
          <div id="cold-room-msg" class="msg" style="display: none"></div>
          <form id="cold-room-form" enctype="multipart/form-data">
            <div class="form-row">
              <div class="form-group">
                <label>Cold Room Name</label>
                <input
                  type="text"
                  name="name"
                  placeholder="e.g. Eko Cold Storage Hub"
                  required
                />
              </div>
              <div class="form-group">
                <label>City</label>
                <input
                  type="text"
                  name="city"
                  placeholder="e.g. Lagos"
                  required
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>State</label>
                <select name="state" required>
                  <option value="">Select State</option>
                  <option>Lagos</option>
                  <option>Kano</option>
                  <option>FCT Abuja</option>
                  <option>Rivers</option>
                  <option>Oyo</option>
                  <option>Kaduna</option>
                  <option>Enugu</option>
                  <option>Edo</option>
                  <option>Delta</option>
                  <option>Anambra</option>
                  <option>Imo</option>
                  <option>Abia</option>
                  <option>Cross River</option>
                  <option>Akwa Ibom</option>
                  <option>Bayelsa</option>
                  <option>Benue</option>
                  <option>Kogi</option>
                  <option>Kwara</option>
                  <option>Osun</option>
                  <option>Ogun</option>
                  <option>Ondo</option>
                  <option>Ekiti</option>
                  <option>Plateau</option>
                  <option>Nasarawa</option>
                  <option>Niger State</option>
                  <option>Kebbi</option>
                  <option>Sokoto</option>
                  <option>Zamfara</option>
                  <option>Katsina</option>
                  <option>Jigawa</option>
                  <option>Bauchi</option>
                  <option>Gombe</option>
                  <option>Adamawa</option>
                  <option>Taraba</option>
                  <option>Borno</option>
                  <option>Yobe</option>
                  <option>Ebonyi</option>
                </select>
              </div>
              <div class="form-group">
                <label>Temperature Range</label>
                <select name="temperature" required>
                  <option value="0–2°C">0–2°C (Frozen)</option>
                  <option value="2–4°C">2–4°C (Fresh Produce)</option>
                  <option value="4–8°C">4–8°C (Dairy/Drinks)</option>
                  <option value="8–15°C">8–15°C (Root Vegetables)</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Rate Per Day (₦)</label>
                <input
                  type="number"
                  name="rate_per_day"
                  placeholder="e.g. 3500"
                  required
                />
              </div>
              <div class="form-group">
                <label>Total Slots Available</label>
                <input
                  type="number"
                  name="total_slots"
                  placeholder="e.g. 20"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <label>Full Address</label>
              <input
                type="text"
                name="address"
                placeholder="e.g. 10 Industrial Avenue, Ikeja, Lagos"
              />
            </div>
            <div class="form-group">
              <label>Facility Photo</label>
              <input type="file" name="image" accept="image/*" />
            </div>
            <button type="submit" class="submit-btn">List Cold Room</button>
          </form>
        </div>
        <div class="dash-card">
          <h3>❄️ My Cold Rooms</h3>
          <div id="my-cold-rooms"></div>
        </div>
      </div>

      <!-- Equipment Tab -->
      <div id="tab-equipment" class="dash-tab-content">
        <div class="dash-card">
          <h3>➕ List Equipment</h3>
          <div id="equipment-msg" class="msg" style="display: none"></div>
          <form id="equipment-form" enctype="multipart/form-data">
            <div class="form-row">
              <div class="form-group">
                <label>Equipment Title</label>
                <input
                  type="text"
                  name="title"
                  placeholder="e.g. John Deere Tractor 75HP"
                  required
                />
              </div>
              <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                  <option value="">Select</option>
                  <option value="tractor">Tractor</option>
                  <option value="pump">Water Pump</option>
                  <option value="sprayer">Sprayer</option>
                  <option value="harvester">Harvester</option>
                  <option value="plough">Plough</option>
                  <option value="irrigation">Irrigation System</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Listing Type</label>
                <select
                  name="listing_type"
                  required
                  onchange="toggleRentPeriod(this.value)"
                >
                  <option value="sale">For Sale</option>
                  <option value="rent">For Rent</option>
                </select>
              </div>
              <div class="form-group">
                <label>Condition</label>
                <select name="condition">
                  <option value="new">New</option>
                  <option value="good">Good (Used)</option>
                  <option value="fair">Fair (Used)</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Price (₦)</label>
                <input
                  type="number"
                  name="price"
                  placeholder="e.g. 95000"
                  required
                />
              </div>
              <div
                class="form-group"
                id="rent-period-group"
                style="display: none"
              >
                <label>Rent Period</label>
                <select name="rent_period">
                  <option value="daily">Per Day</option>
                  <option value="weekly">Per Week</option>
                  <option value="monthly">Per Month</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Location</label>
                <input
                  type="text"
                  name="location"
                  placeholder="e.g. Ibadan"
                  required
                />
              </div>
              <div class="form-group">
                <label>State</label>
                <select name="state" required>
                  <option value="">Select State</option>
                  <option>Lagos</option>
                  <option>Kano</option>
                  <option>FCT Abuja</option>
                  <option>Rivers</option>
                  <option>Oyo</option>
                  <option>Kaduna</option>
                  <option>Enugu</option>
                  <option>Edo</option>
                  <option>Delta</option>
                  <option>Anambra</option>
                  <option>Imo</option>
                  <option>Plateau</option>
                  <option>Nasarawa</option>
                  <option>Niger State</option>
                  <option>Benue</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea
                name="description"
                placeholder="Describe the equipment, specifications, etc."
              ></textarea>
            </div>
            <div class="form-group">
              <label>Equipment Photo</label>
              <input type="file" name="image" accept="image/*" />
            </div>
            <button type="submit" class="submit-btn">List Equipment</button>
          </form>
        </div>
        <div class="dash-card">
          <h3>🚜 My Equipment Listings</h3>
          <div id="my-equipment" class="product-grid"></div>
        </div>
      </div>

      <!-- Farmland Tab -->
      <div id="tab-farmland" class="dash-tab-content">
        <div class="dash-card">
          <h3>➕ List Farmland</h3>
          <div id="farmland-msg" class="msg" style="display: none"></div>
          <form id="farmland-form" enctype="multipart/form-data">
            <div class="form-row">
              <div class="form-group">
                <label>Land Title</label>
                <input
                  type="text"
                  name="title"
                  placeholder="e.g. 5-Hectare Irrigated Land, Kaduna"
                  required
                />
              </div>
              <div class="form-group">
                <label>Size (Hectares)</label>
                <input
                  type="number"
                  name="size_hectares"
                  placeholder="e.g. 5"
                  step="0.1"
                  required
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Soil Type</label>
                <select name="soil_type">
                  <option value="">Select</option>
                  <option value="loamy">Loamy</option>
                  <option value="sandy">Sandy</option>
                  <option value="clay">Clay</option>
                  <option value="silt">Silt</option>
                  <option value="mixed">Mixed</option>
                </select>
              </div>
              <div class="form-group">
                <label>Water Source</label>
                <select name="water_source">
                  <option value="">Select</option>
                  <option value="river">River</option>
                  <option value="borehole">Borehole</option>
                  <option value="rain">Rain-fed</option>
                  <option value="irrigation">Irrigation System</option>
                  <option value="none">None</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Location / Town</label>
                <input
                  type="text"
                  name="location"
                  placeholder="e.g. Zaria"
                  required
                />
              </div>
              <div class="form-group">
                <label>State</label>
                <select name="state" required>
                  <option value="">Select State</option>
                  <option>Lagos</option>
                  <option>Kano</option>
                  <option>FCT Abuja</option>
                  <option>Rivers</option>
                  <option>Oyo</option>
                  <option>Kaduna</option>
                  <option>Enugu</option>
                  <option>Edo</option>
                  <option>Delta</option>
                  <option>Anambra</option>
                  <option>Imo</option>
                  <option>Benue</option>
                  <option>Plateau</option>
                  <option>Nasarawa</option>
                  <option>Niger State</option>
                  <option>Kebbi</option>
                  <option>Sokoto</option>
                  <option>Zamfara</option>
                  <option>Katsina</option>
                  <option>Jigawa</option>
                  <option>Bauchi</option>
                  <option>Gombe</option>
                  <option>Adamawa</option>
                  <option>Taraba</option>
                  <option>Borno</option>
                  <option>Yobe</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Full Address</label>
              <input
                type="text"
                name="address"
                placeholder="Full address of the land"
              />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Latitude (optional)</label>
                <input
                  type="number"
                  name="lat"
                  step="any"
                  id="land-lat"
                  placeholder="e.g. 10.5222"
                />
              </div>
              <div class="form-group">
                <label>Longitude (optional)</label>
                <input
                  type="number"
                  name="lng"
                  step="any"
                  id="land-lng"
                  placeholder="e.g. 7.4383"
                />
              </div>
            </div>
            <button
              type="button"
              class="submit-btn"
              style="background: #065f46; margin-bottom: 0.5rem"
              onclick="getLandLocation()"
            >
              📌 Use Current Location
            </button>
            <div
              id="land-location-status"
              style="font-size: 0.85rem; color: #065f46; margin-bottom: 0.75rem"
            ></div>
            <div class="form-row">
              <div class="form-group">
                <label>Price Per Season (₦)</label>
                <input
                  type="number"
                  name="price_per_season"
                  placeholder="e.g. 150000"
                  required
                />
              </div>
              <div class="form-group">
                <label>Rent Period</label>
                <select name="rent_period">
                  <option value="season">Per Season</option>
                  <option value="year">Per Year</option>
                  <option value="month">Per Month</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea
                name="description"
                placeholder="Describe the land, suitable crops, access road etc."
              ></textarea>
            </div>
            <div class="form-group">
              <label>Land Photo</label>
              <input type="file" name="image" accept="image/*" />
            </div>
            <button type="submit" class="submit-btn">List Farmland</button>
          </form>
        </div>
        <div class="dash-card">
          <h3>🌱 My Farmland Listings</h3>
          <div id="my-farmland" class="product-grid"></div>
        </div>
      </div>

      <!-- Notifications Tab -->
      <div id="tab-notifications" class="dash-tab-content">
        <div class="dash-card">
          <h3>🔔 Notifications</h3>
          <div
            style="
              display: flex;
              justify-content: flex-end;
              margin-bottom: 1rem;
            "
          >
            <button
              onclick="markAllRead()"
              style="
                padding: 0.3rem 0.75rem;
                background: #f3f4f6;
                border: none;
                border-radius: 0.5rem;
                cursor: pointer;
                font-size: 0.85rem;
              "
            >
              Mark all as read
            </button>
          </div>
          <div id="notifications-list"></div>
        </div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem("token");
      const role = localStorage.getItem("role");
      if (!token || role !== "vendor") window.location.href = "/login";

      function showTab(name, btn) {
        document
          .querySelectorAll(".dash-tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".dash-tab-content")
          .forEach((t) => t.classList.remove("active"));
        document.getElementById(`tab-${name}`).classList.add("active");
        btn.classList.add("active");
      }

      function logout() {
        localStorage.clear();
        window.location.href = "/";
      }

      async function api(url, options = {}) {
        return fetch(url, {
          ...options,
          headers: {
            Authorization: `Bearer ${token}`,
            ...(options.headers || {}),
          },
        });
      }

      function toggleRentPeriod(val) {
        document.getElementById("rent-period-group").style.display =
          val === "rent" ? "block" : "none";
      }

      async function loadProfile() {
        const res = await api("/auth/me");
        const user = await res.json();
        document.getElementById("user-name").textContent = user.full_name;
        document.getElementById("verification-status").textContent =
          user.is_verified ? "Verified ✅" : "Pending ⏳";
        if (!user.is_verified) {
          const notice = document.createElement("div");
          notice.className = "msg";
          notice.style.background = "#fef3c7";
          notice.style.color = "#92400e";
          notice.style.padding = "0.75rem";
          notice.style.borderRadius = "0.75rem";
          notice.style.marginBottom = "1rem";
          notice.textContent =
            "⚠️ Your account is pending verification. You can prepare your listings but they will only go live after admin approval.";
          document.querySelector(".dash-container").prepend(notice);
        }
      }

      async function loadMyColdRooms() {
        const res = await api("/vendor/my-cold-rooms");
        const rooms = await res.json();
        document.getElementById("total-cold-rooms").textContent = rooms.length;
        const container = document.getElementById("my-cold-rooms");
        if (!rooms.length) {
          container.innerHTML =
            '<p style="color:#6b7280">No cold rooms listed yet.</p>';
          return;
        }
        container.innerHTML = rooms
          .map(
            (r) => `
        <div class="order-card">
          <div class="order-info">
            <h4>❄️ ${r.name}</h4>
            <p>${r.city}, ${r.state} • ${r.temperature}</p>
            <p>Slots: ${r.available_slots}/${r.total_slots} • ₦${r.rate_per_day.toLocaleString()}/day</p>
          </div>
          <span class="status-badge ${r.is_active ? "status-active" : "status-cancelled"}">${r.is_active ? "Active" : "Inactive"}</span>
        </div>
      `,
          )
          .join("");
      }

      async function loadMyEquipment() {
        const res = await api("/vendor/my-equipment");
        const items = await res.json();
        document.getElementById("total-equipment").textContent = items.length;
        const container = document.getElementById("my-equipment");
        if (!items.length) {
          container.innerHTML =
            '<p style="color:#6b7280">No equipment listed yet.</p>';
          return;
        }
        container.innerHTML = items
          .map(
            (e) => `
        <div class="product-card">
          <div class="product-photo" style="${e.image_path ? `background-image:url('${e.image_path}')` : "background:#f0fdf4; display:flex; align-items:center; justify-content:center; font-size:2rem"}">
            ${!e.image_path ? "🚜" : ""}
          </div>
          <div class="product-body">
            <h4>${e.title}</h4>
            <p class="product-meta">${e.category} • ${e.listing_type} • ${e.condition}</p>
            <p class="product-meta">📍 ${e.location}, ${e.state}</p>
            <p class="product-price">₦${e.price.toLocaleString()}${e.rent_period ? "/" + e.rent_period : ""}</p>
            <div class="product-buttons">
              <button class="contact-btn" style="background:#fee2e2;color:#991b1b" onclick="removeEquipment(${e.id})">Remove</button>
            </div>
          </div>
        </div>
      `,
          )
          .join("");
      }

      async function loadMyFarmland() {
        const res = await api("/vendor/my-farmland");
        const items = await res.json();
        document.getElementById("total-farmland").textContent = items.length;
        const container = document.getElementById("my-farmland");
        if (!items.length) {
          container.innerHTML =
            '<p style="color:#6b7280">No farmland listed yet.</p>';
          return;
        }
        container.innerHTML = items
          .map(
            (l) => `
        <div class="product-card">
          <div class="product-photo" style="${l.image_path ? `background-image:url('${l.image_path}')` : "background:#d1fae5; display:flex; align-items:center; justify-content:center; font-size:2rem"}">
            ${!l.image_path ? "🌱" : ""}
          </div>
          <div class="product-body">
            <h4>${l.title}</h4>
            <p class="product-meta">📍 ${l.location}, ${l.state}</p>
            <p class="product-meta">${l.size_hectares} hectares</p>
            <p class="product-price">₦${l.price_per_season.toLocaleString()}/${l.rent_period}</p>
          </div>
        </div>
      `,
          )
          .join("");
      }

      async function removeEquipment(id) {
        if (!confirm("Remove this listing?")) return;
        await api(`/equipment/${id}`, { method: "DELETE" });
        loadMyEquipment();
      }

      function getLandLocation() {
        const btn = document.querySelector('[onclick="getLandLocation()"]');
        btn.textContent = "📌 Getting location...";
        btn.disabled = true;
        if (!navigator.geolocation) {
          alert("Geolocation not supported");
          btn.disabled = false;
          return;
        }
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            document.getElementById("land-lat").value = lat.toFixed(6);
            document.getElementById("land-lng").value = lng.toFixed(6);
            // Reverse geocode to get address
            try {
              const res = await fetch(
                `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
              );
              const data = await res.json();
              const addr = data.address || {};
              const city =
                addr.city || addr.town || addr.village || addr.county || "";
              const state = addr.state || "";
              const fullAddress =
                data.display_name || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
              const shortAddress = [
                addr.road,
                addr.suburb,
                city,
                state,
                "Nigeria",
              ]
                .filter(Boolean)
                .join(", ");
              // Fill address field
              const addrField = document.querySelector(
                '#tab-farmland [name="address"]',
              );
              if (addrField) addrField.value = fullAddress;
              // Fill location field with city/town
              const locField = document.querySelector(
                '#tab-farmland [name="location"]',
              );
              if (locField && city) locField.value = city;
              // Match and select state dropdown
              const stateField = document.querySelector(
                '#tab-farmland [name="state"]',
              );
              if (stateField && state) {
                const options = Array.from(stateField.options);
                const match = options.find(
                  (o) =>
                    state.toLowerCase().includes(o.value.toLowerCase()) ||
                    o.value
                      .toLowerCase()
                      .includes(state.toLowerCase().split(" ")[0]),
                );
                if (match) stateField.value = match.value;
              }
              document.getElementById("land-location-status").textContent =
                `📌 ${shortAddress}`;
            } catch (e) {
              document.getElementById("land-location-status").textContent =
                `📌 Coordinates captured: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            }
            btn.textContent = "📌 Location Captured ✅";
            btn.disabled = false;
          },
          (err) => {
            alert(`Could not get location: ${err.message}`);
            btn.textContent = "📌 Use Current Location";
            btn.disabled = false;
          },
          { enableHighAccuracy: true, timeout: 10000 },
        );
      }

      async function loadNotifications() {
        const res = await api("/notifications");
        const notifications = await res.json();
        const container = document.getElementById("notifications-list");
        if (!notifications.length) {
          container.innerHTML =
            '<p style="color:#6b7280">No notifications yet.</p>';
          return;
        }
        container.innerHTML = notifications
          .map(
            (n) => `
        <div class="order-card" style="border-left:4px solid ${n.is_read ? "#e5e7eb" : "#10b981"}; background:${n.is_read ? "white" : "#f0fdf4"}">
          <div class="order-info">
            <h4>${n.title}</h4>
            <p>${n.message}</p>
            <p style="font-size:0.75rem; color:#9ca3af">${new Date(n.created_at).toLocaleString()}</p>
          </div>
          ${!n.is_read ? `<button onclick="markRead(${n.id})" style="padding:0.3rem 0.6rem; background:#f3f4f6; border:none; border-radius:0.5rem; cursor:pointer; font-size:0.75rem">Mark read</button>` : ""}
        </div>
      `,
          )
          .join("");
      }

      async function markRead(id) {
        await api(`/notifications/${id}/read`, { method: "PUT" });
        loadNotifications();
      }
      async function markAllRead() {
        await api("/notifications/read-all", { method: "PUT" });
        loadNotifications();
      }

      // Form submissions
      document
        .getElementById("cold-room-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = e.target.querySelector('button[type="submit"]');
          btn.disabled = true;
          btn.textContent = "Listing...";
          const res = await api("/vendor/cold-rooms/add", {
            method: "POST",
            body: new FormData(e.target),
          });
          const data = await res.json();
          const msg = document.getElementById("cold-room-msg");
          msg.style.display = "block";
          if (res.ok) {
            msg.className = "msg success";
            msg.textContent = data.message;
            e.target.reset();
            loadMyColdRooms();
          } else {
            msg.className = "msg error";
            msg.textContent =
              typeof data.detail === "string"
                ? data.detail
                : data.detail?.msg ||
                  JSON.stringify(data.detail) ||
                  "Failed. Please check all required fields.";
          }
          btn.disabled = false;
          btn.textContent = "List Cold Room";
        });

      loadProfile();
      loadMyColdRooms();
      loadMyEquipment();
